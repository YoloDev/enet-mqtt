name: release-please

on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      actions: write
      statuses: write

    steps:
      - uses: GoogleCloudPlatform/release-please-action@db8f2c60ee802b3748b512940dde88eabd7b7e01 # v3.7.13
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          command: manifest

      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - if: ${{ steps.release.outputs.release_created }}
        uses: ./.github/workflows/upload-binaries.yml
        with:
          release: ${{ steps.release.outputs.tag_name }}
