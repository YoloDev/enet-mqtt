name: Upload release binaries

on:
  workflow_call:
    inputs:
      release:
        description: GitHub release
        required: true
        type: string

  # TODO: remove
  workflow_dispatch:
    inputs:
      release:
        description: GitHub release
        required: true
        type: string

# permissions:
#   contents: read
#   packages: write

jobs:
  release:
    name: Create and upload binaries to GitHub release
    runs-on: ubuntu-latest
    steps:
      - id: tag
        run: |
          TAG_NAME="${{ inputs.release }}"
          if [[ -z "$TAG_NAME" ]]; then
            TAG_NAME="${{ github.event.inputs.release }}"
          fi
          echo tag=$TAG_NAME
          echo ::set-output name=tag::$TAG_NAME
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@27d0a4f181a40b142cce983c5393082c365d1480 # v1.2.0
      - uses: earthly/actions/setup-earthly@v1
      - run: earthly --version

      - name: Docker login
        if: github.ref == 'refs/heads/main' && github.repository == 'YoloDev/enet-mqtt'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - run: mkdir -p build
      - run: earthly --push --remote-cache=ghcr.io/yolodev/enet-mqtt:build-cache --artifact "+all/*" build/
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/*
          tag: ${{ steps.tag.outputs.tag }}
          file_glob: true
